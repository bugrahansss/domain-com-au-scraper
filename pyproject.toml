[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-com-au-scraper"
version = "0.1.0"
description = "Scrape Domain.com.au property listings for sale, for rent and sold (price, beds, address, agency, suburb medians) with Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["domain.com.au", "domain", "real estate", "property", "australia", "web scraping", "scraper", "scrapedo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25", "beautifulsoup4>=4.9"]

[project.urls]
Homepage = "https://github.com/bugrahansss/domain-com-au-scraper"
Source = "https://github.com/bugrahansss/domain-com-au-scraper"
Issues = "https://github.com/bugrahansss/domain-com-au-scraper/issues"

[project.scripts]
domain-scraper = "domain_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
